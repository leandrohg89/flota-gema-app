<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FlotaGema</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{--bg:#f5f5f3;--sur:#fff;--sur2:#f0efed;--bdr:#e2e0dc;--bdr2:#d0ceca;--tx:#1a1916;--tx2:#6b6760;--tx3:#9c9890;--red:#c0392b;--rbg:#fdf1f0;--rbd:#f5c6c2;--amb:#b7600a;--abg:#fef6ec;--abd:#fcdcb0;--grn:#1a6b3a;--gbg:#f0f8f3;--gbd:#b8e0c8;--blu:#1a4a8a;--bbg:#f0f5fd;--bbd:#b8d0f0;--r:10px;--rs:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;height:100vh;overflow:hidden;display:flex}
.sidebar{width:215px;background:var(--sur);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow-y:auto}
.logo{padding:18px 16px 14px;border-bottom:1px solid var(--bdr)}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.5px}
.logo-sub{font-size:10px;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.sb-sec{padding:12px 8px 4px}
.sb-lbl{font-size:10px;color:var(--tx3);letter-spacing:.8px;text-transform:uppercase;padding:0 8px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--rs);cursor:pointer;color:var(--tx2);font-size:13px;margin-bottom:2px;transition:background .12s}
.nav-item:hover{background:var(--sur2);color:var(--tx)}
.nav-item.active{background:var(--tx);color:#fff}
.nav-item i{font-size:15px}
.sb-div{height:1px;background:var(--bdr);margin:6px 8px}
.unit-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--rs);font-size:12px;color:var(--tx2);margin-bottom:2px;cursor:pointer}
.unit-row:hover{background:var(--sur2)}
.unit-row.active-unit{background:var(--sur2);font-weight:600;color:var(--tx)}
.udot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-total{padding:14px 16px;margin-top:auto;border-top:1px solid var(--bdr);font-size:11px;color:var(--tx3)}
.sb-total strong{color:var(--tx);font-size:13px;display:block;margin-bottom:2px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100vh}
.topbar{background:var(--sur);border-bottom:1px solid var(--bdr);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px}
.tb-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tb-title{font-size:15px;font-weight:600}
.tb-sub{font-size:11px;color:var(--tx3);margin-top:1px}
.uf{display:flex;gap:3px;background:var(--sur2);border-radius:var(--rs);padding:3px}
.uf-btn{background:none;border:none;border-radius:4px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--tx2);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.uf-btn:hover{background:rgba(255,255,255,.7);color:var(--tx)}
.uf-btn.active{background:var(--sur);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tb-right{display:flex;gap:8px;flex-shrink:0}
.btn{border:1px solid var(--bdr2);background:var(--sur);border-radius:var(--rs);padding:7px 13px;font-size:12px;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .12s}
.btn:hover{background:var(--sur2)}
.btn-p{background:var(--tx);color:#fff;border-color:var(--tx)}
.btn-p:hover{background:#333}
.content{flex:1;overflow-y:auto;padding:20px 22px}
.vsel{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.vcard{flex-shrink:0;background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--r);padding:11px 14px;cursor:pointer;transition:all .15s;min-width:140px;max-width:165px}
.vcard:hover{border-color:var(--bdr2)}
.vcard.sel{border-color:var(--tx);background:var(--tx)}
.vcard.sel .vcp{color:#fff}.vcard.sel .vcn{color:rgba(255,255,255,.65)}.vcard.sel .vcu{background:rgba(255,255,255,.15);color:rgba(255,255,255,.9)}
.vcard.valert{border-color:var(--rbd)}.vcard.vwarn{border-color:var(--abd)}
.vcp{font-size:12px;font-weight:700;letter-spacing:1px;font-family:'Courier New',monospace;color:var(--tx)}
.vcn{font-size:10px;color:var(--tx3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcu{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;margin-top:6px;background:var(--sur2);color:var(--tx2)}
.vdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-left:5px;vertical-align:middle}
.tag-multa{display:inline-block;background:var(--rbg);color:var(--red);border:1px solid var(--rbd);font-size:9px;font-weight:600;padding:1px 6px;border-radius:20px;margin-left:4px}
.vadd{border-style:dashed!important;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--tx3)!important;font-size:12px;min-width:110px}
.detail-grid{display:grid;grid-template-columns:1fr 310px;gap:14px}
.veh-hdr{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.big-plate{font-size:22px;font-weight:800;letter-spacing:2px;font-family:'Courier New',monospace}
.veh-model{font-size:13px;color:var(--tx2);margin-top:3px}
.veh-meta{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.vm-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.vm-val{font-size:11px;font-weight:500;margin-top:2px;font-family:monospace}
.vm-val.nm{font-family:inherit;font-size:12px}
.sbadge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.sbadge i{font-size:13px}
.sb-wk{background:var(--bbg);color:var(--blu);border:1px solid var(--bbd)}
.sb-ok{background:var(--gbg);color:var(--grn);border:1px solid var(--gbd)}
.sb-al{background:var(--rbg);color:var(--red);border:1px solid var(--rbd)}
.sb-wn{background:var(--abg);color:var(--amb);border:1px solid var(--abd)}
.sec-title{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:8px}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dcrd{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 14px;position:relative}
.dcrd.dal{border-color:var(--rbd);background:var(--rbg)}.dcrd.dwn{border-color:var(--abd);background:var(--abg)}.dcrd.dok{border-color:var(--gbd);background:var(--gbg)}
.dc-top{display:flex;align-items:flex-start;justify-content:space-between}
.dc-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);display:flex;align-items:center;gap:4px}
.dc-lbl i{font-size:12px}
.dal .dc-lbl{color:var(--red)}.dwn .dc-lbl{color:var(--amb)}.dok .dc-lbl{color:var(--grn)}
.dc-edit-btn{background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:4px;color:var(--tx3);font-size:11px;opacity:0;transition:opacity .15s;display:flex;align-items:center;gap:3px}
.dcrd:hover .dc-edit-btn{opacity:1}
.dc-edit-btn:hover{background:rgba(0,0,0,.07);color:var(--tx)}
.dc-v{font-size:16px;font-weight:700;color:var(--tx);margin-top:5px}
.dal .dc-v{color:var(--red)}.dwn .dc-v{color:var(--amb)}.dok .dc-v{color:var(--grn)}
.dc-s{font-size:11px;color:var(--tx2);margin-top:2px}
.dal .dc-s{color:#d05040}.dwn .dc-s{color:#c07020}.dok .dc-s{color:#2a8a50}
.ie-wrap{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08);display:none}
.ie-wrap input,.ie-wrap select{width:100%;border:1px solid var(--bdr2);border-radius:var(--rs);padding:5px 8px;font-size:12px;color:var(--tx);background:var(--sur);outline:none;font-family:inherit;margin-bottom:5px}
.ie-wrap input:focus,.ie-wrap select:focus{border-color:var(--tx)}
.ie-actions{display:flex;gap:6px;margin-top:4px}
.ie-save{background:var(--tx);color:#fff;border:none;border-radius:4px;padding:4px 12px;font-size:11px;cursor:pointer}
.ie-cancel{background:none;border:1px solid var(--bdr2);border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--tx2)}
.multas-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.multa-total{font-size:20px;font-weight:800;color:var(--red);margin:6px 0 10px}
.multa-jur{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.multa-jur:last-child{border-bottom:none}
.no-multas{font-size:12px;color:var(--grn);display:flex;align-items:center;gap:6px;padding:4px 0}
.km-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:14px}
.km-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.km-v{font-size:19px;font-weight:700}
.km-bar-bg{background:var(--sur2);border-radius:4px;height:7px;overflow:hidden;margin-bottom:5px}
.km-bar-fill{height:7px;border-radius:4px}
.km-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--tx3)}
.ws-banner{background:var(--bbg);border:1px solid var(--bbd);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.ws-icon{font-size:20px;color:var(--blu);flex-shrink:0}
.ws-title{font-size:13px;font-weight:600;color:var(--blu)}
.ws-sub{font-size:11px;color:#2a5aa0;margin-top:2px}
.right-col{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}
.ph{padding:11px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.ph-title{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.ph-title i{font-size:13px}
.ph-action{font-size:11px;color:var(--tx3);cursor:pointer;padding:2px 6px;border-radius:4px}
.ph-action:hover{background:var(--sur2);color:var(--tx)}
.ri{padding:10px 14px;border-bottom:1px solid var(--bdr)}
.ri:last-child{border-bottom:none}
.ri-date{font-size:10px;color:var(--tx3);margin-bottom:2px}
.ri-desc{font-size:12px;font-weight:500;color:var(--tx)}
.ri-taller{font-size:11px;color:var(--tx2);margin-top:2px;display:flex;align-items:center;gap:4px}
.ri-cost{font-size:12px;font-weight:600;color:var(--tx);margin-top:3px}
.ai{padding:10px 14px;border-bottom:1px solid var(--bdr);display:flex;gap:9px;align-items:flex-start}
.ai:last-child{border-bottom:none}
.ai-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.ai-title{font-size:12px;font-weight:600}
.ai-sub{font-size:11px;color:var(--tx2);margin-top:1px}
.empty{padding:16px;text-align:center;color:var(--tx3);font-size:12px}
.empty i{font-size:20px;display:block;margin-bottom:5px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--sur);border-radius:var(--r);border:1px solid var(--bdr);padding:20px;width:390px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:14px;font-weight:600;margin-bottom:14px}
.fr{margin-bottom:10px}
.fr label{font-size:11px;color:var(--tx2);display:block;margin-bottom:4px}
.fr input,.fr select,.fr textarea{width:100%;border:1px solid var(--bdr2);border-radius:var(--rs);padding:7px 10px;font-size:13px;color:var(--tx);background:var(--sur);outline:none;font-family:inherit}
.fr input:focus,.fr select:focus{border-color:var(--tx)}
.fr textarea{height:54px;resize:vertical}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><div class="logo-name">FlotaGema</div><div class="logo-sub">Gestion vehicular</div></div>
  <div class="sb-sec">
    <div class="sb-lbl">Panel</div>
    <div class="nav-item active"><i class="ti ti-layout-dashboard"></i>Dashboard</div>
    <div class="nav-item" onclick="openModal('vehiculo')"><i class="ti ti-car"></i>Vehiculos</div>
    <div class="nav-item" onclick="openModal('servicio')"><i class="ti ti-oil"></i>Services</div>
    <div class="nav-item" onclick="openModal('reparacion')"><i class="ti ti-settings-2"></i>Reparaciones</div>
  </div>
  <div class="sb-div"></div>
  <div class="sb-sec">
    <div class="sb-lbl">Unidades</div>
    <div class="unit-row" onclick="setFilter('GEMA',null)"><span class="udot" style="background:#1a4a8a"></span><span id="sb-gema">GEMA</span></div>
    <div class="unit-row" onclick="setFilter('URC',null)"><span class="udot" style="background:#1a6b3a"></span><span id="sb-urc">URC</span></div>
    <div class="unit-row" onclick="setFilter('PEX',null)"><span class="udot" style="background:#5a2d82"></span>PEX</div>
  </div>
  <div class="sb-total"><strong id="sb-count">--</strong>flota registrada</div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="tb-left">
      <div><div class="tb-title">Flota general</div><div class="tb-sub" id="tb-sub">Selecciona un vehiculo</div></div>
      <div class="uf" id="uf">
        <button class="uf-btn active" onclick="setFilter('all',this)">Todas</button>
        <button class="uf-btn" onclick="setFilter('GEMA',this)"><span style="width:7px;height:7px;border-radius:50%;background:#1a4a8a;display:inline-block"></span>GEMA</button>
        <button class="uf-btn" onclick="setFilter('URC',this)"><span style="width:7px;height:7px;border-radius:50%;background:#1a6b3a;display:inline-block"></span>URC</button>
        <button class="uf-btn" onclick="setFilter('PEX',this)"><span style="width:7px;height:7px;border-radius:50%;background:#5a2d82;display:inline-block"></span>PEX</button>
      </div>
    </div>
    <div class="tb-right">
      <button class="btn" onclick="openModal('servicio')"><i class="ti ti-plus"></i>Service</button>
      <button class="btn btn-p" onclick="openModal('vehiculo')"><i class="ti ti-plus"></i>Vehiculo</button>
    </div>
  </div>
  <div class="content">
    <div class="vsel" id="vsel"></div>
    <div id="detail"></div>
  </div>
</div>

<div class="modal-bg" id="modal" onclick="closeBg(event)">
  <div class="modal">
    <h3 id="m-title"></h3>
    <div id="m-body"></div>
    <div class="modal-foot">
      <button class="btn" onclick="document.getElementById('modal').classList.remove('open')">Cancelar</button>
      <button class="btn btn-p" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

function setFilter(f,btn){
  activeFilter = f;
  document.querySelectorAll(".uf-btn").forEach(function(b){b.classList.remove("active");});
  if(btn) btn.classList.add("active");
  else {
    var map={"all":0,"GEMA":1,"URC":2,"PEX":3};
    var btns=document.querySelectorAll(".uf-btn");
    if(btns[map[f]]) btns[map[f]].classList.add("active");
  }
  var visible = flota.filter(function(v){ return f==="all"||v.und===f; });
  if(visible.length>0 && !visible.find(function(v){return v.id===selId;})) selId=visible[0].id;
  renderSel(); renderDetail();
}

function renderSel(){
  var el=document.getElementById("vsel"), h="";
  var list = flota.filter(function(v){ return activeFilter==="all"||v.und===activeFilter; });
  for(var i=0;i<list.length;i++){
    var v=list[i];
    var wd=worst(v), kd=v.km-v.lsrv, tm=totalM(v.pk);
    var ac=wd<=0||kd>=10000?"valert":wd<=30||kd>=7000?"vwarn":"";
    var dot=v.estado==="taller"?"#1a4a8a":wd<=0||kd>=10000?"#c0392b":wd<=30?"#b7600a":"#1a6b3a";
    var sel=v.id===selId?"sel":"";
    var cuSt=sel?"background:rgba(255,255,255,.15);color:rgba(255,255,255,.9)":"background:"+ubg(v.und)+";color:"+ucol(v.und);
    h+='<div class="vcard '+ac+" "+sel+'" onclick="selVeh('+v.id+')">';
    h+='<div class="vcp">'+v.pat+'<span class="vdot" style="background:'+dot+'"></span></div>';
    h+='<div class="vcn">'+v.veh+"</div>";
    h+='<span class="vcu" style="'+cuSt+'">'+v.und+"</span>";

  }
  h+='<div class="vcard vadd" onclick="openModal(\'vehiculo\')"><i class="ti ti-plus" style="font-size:15px"></i>Agregar</div>';
  el.innerHTML=h;

  var v=flota.find(function(f){return f.id===id;});
  mtype="km_"+id;
  document.getElementById("m-title").textContent="Actualizar km - "+v.pat;
  var kmLbl="Km actuales"+(v.km?" (actual: "+nAR(v.km)+")" :"");
  document.getElementById("m-body").innerHTML="<div class=\"fr\"><label>"+kmLbl+"</label><input id=\"f-km\" type=\"number\" value=\""+(v.km||0)+"\">"+"</div>";
  document.getElementById("modal").classList.add("open");
}

function editVeh(id){
  var v=flota.find(function(f){return f.id===id;});
  mtype="edit_"+id;
  document.getElementById("m-title").textContent="Editar - "+v.pat;
  document.getElementById("m-body").innerHTML=
    '<div class="fr"><label>Aseguradora</label><input id="f-aseg" value="'+(v.aseg||"")+'"></div>'
    +'<div class="fr"><label>Tipo de seguro</label><select id="f-tseg"><option'+(v.tseg==="Todo riesgo"?" selected":"")+'>Todo riesgo</option><option'+(v.tseg==="Todo riesgo con franquicia"?" selected":"")+'>Todo riesgo con franquicia</option><option'+(v.tseg==="Terceros completo"?" selected":"")+'>Terceros completo</option><option'+(v.tseg==="Terceros basico"?" selected":"")+'>Terceros basico</option></select></div>'
    +'<div class="fr"><label>Vto. seguro</label><input id="f-seg" type="date" value="'+(v.seguro||"")+'"></div>'
    +'<div class="fr"><label>Vto. VTV</label><input id="f-vtv" type="date" value="'+(v.vtv||"")+'"></div>'
    +'<div class="fr"><label>Vto. impuesto</label><input id="f-imp" type="date" value="'+(v.imp||"")+'"></div>'
    +'<div class="fr"><label>Estado</label><select id="f-est"><option value="disponible"'+(v.estado==="disponible"?" selected":"")+'>Disponible</option><option value="taller"'+(v.estado==="taller"?" selected":"")+'>En taller</option></select></div>'
    +'<div class="fr"><label>Taller</label><input id="f-taller" value="'+(v.taller||"")+'"></div>'
    +'<div class="fr"><label>Km actuales</label><input id="f-km" type="number" value="'+(v.km||0)+'"></div>'
    +'<div class="fr"><label>Obs.</label><textarea id="f-obs">'+(v.obs||"")+"</textarea></div>";
  document.getElementById("modal").classList.add("open");
}

function openModal(type){
  mtype=type;
  var opts=""; for(var i=0;i<flota.length;i++) opts+='<option value="'+flota[i].id+'">'+flota[i].pat+" - "+flota[i].veh+"</option>";
  var titles={vehiculo:"Nuevo vehiculo",servicio:"Registrar service",reparacion:"Agregar reparacion"};
  document.getElementById("m-title").textContent=titles[type]||type;
  var b="", hoy=new Date().toISOString().slice(0,10);
  if(type==="vehiculo"){
    b='<div class="fr"><label>Patente</label><input id="f-pat"></div>'
     +'<div class="fr"><label>Vehiculo</label><input id="f-veh"></div>'
     +'<div class="fr"><label>Anio</label><input id="f-anio" type="number"></div>'
     +'<div class="fr"><label>Unidad</label><select id="f-und"><option value="GEMA">GEMA</option><option value="URC">URC</option><option value="PEX">PEX</option></select></div>'
     +'<div class="fr"><label>Nro. chasis</label><input id="f-chasis"></div>'
     +'<div class="fr"><label>Nro. motor</label><input id="f-motor"></div>'
     +'<div class="fr"><label>Km actuales</label><input id="f-km" type="number" value="0"></div>'
     +'<div class="fr"><label>Aseguradora</label><input id="f-aseg"></div>'
     +'<div class="fr"><label>Tipo de seguro</label><select id="f-tseg"><option>Todo riesgo</option><option>Todo riesgo con franquicia</option><option>Terceros completo</option><option>Terceros basico</option></select></div>'
     +'<div class="fr"><label>Vto. seguro</label><input id="f-seg" type="date"></div>'
     +'<div class="fr"><label>Vto. VTV</label><input id="f-vtv" type="date"></div>'
     +'<div class="fr"><label>Vto. impuesto</label><input id="f-imp" type="date"></div>';
  } else if(type==="servicio"){
    b='<div class="fr"><label>Vehiculo</label><select id="f-vid">'+opts+'</select></div>'
     +'<div class="fr"><label>Fecha</label><input id="f-fecha" type="date" value="'+hoy+'"></div>'
     +'<div class="fr"><label>Km</label><input id="f-km" type="number"></div>'
     +'<div class="fr"><label>Tipo</label><input id="f-tipo" placeholder="Aceite + filtro"></div>'
     +'<div class="fr"><label>Notas</label><textarea id="f-notas"></textarea></div>';
  } else if(type==="reparacion"){
    b='<div class="fr"><label>Vehiculo</label><select id="f-vid">'+opts+'</select></div>'
     +'<div class="fr"><label>Fecha</label><input id="f-fecha" type="date" value="'+hoy+'"></div>'
     +'<div class="fr"><label>Descripcion</label><textarea id="f-desc"></textarea></div>'
     +'<div class="fr"><label>Taller</label><input id="f-taller"></div>'
     +'<div class="fr"><label>Costo ($)</label><input id="f-costo" type="number"></div>';
  }
  document.getElementById("m-body").innerHTML=b;
  document.getElementById("modal").classList.add("open");
}

function openSalida(vid){
  mtype="salida_"+vid;
  var v=flota.find(function(f){return f.id===vid;});
  document.getElementById("m-title").textContent="Salida del taller - "+v.pat;
  document.getElementById("m-body").innerHTML=
    '<div class="fr"><label>Fecha de salida</label><input id="f-fecha" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
    +'<div class="fr"><label>Taller</label><input id="f-taller" value="'+(v.taller||"")+'"></div>'
    +'<div class="fr"><label>Descripcion del trabajo realizado</label><textarea id="f-desc" placeholder="Detalle de reparaciones...">'+(v.obs||"")+"</textarea></div>"
    +'<div class="fr"><label>Costo total ($)</label><input id="f-costo" type="number" placeholder="0"></div>'
    +'<div class="fr"><label>Km al momento de la salida</label><input id="f-km" type="number" value="'+(v.km||0)+'"></div>';
  document.getElementById("modal").classList.add("open");
}

function openIngreso(vid){
  mtype="ingreso_"+vid;
  var v=flota.find(function(f){return f.id===vid;});
  document.getElementById("m-title").textContent="Ingresar a taller - "+v.pat;
  document.getElementById("m-body").innerHTML=
    '<div class="fr"><label>Fecha de ingreso</label><input id="f-fecha" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
    +'<div class="fr"><label>Taller</label><input id="f-taller" value="'+(v.taller||"")+'"></div>'
    +'<div class="fr"><label>Motivo / Descripcion</label><textarea id="f-desc" placeholder="Por que ingresa al taller..."></textarea></div>'
    +'<div class="fr"><label>Km actuales</label><input id="f-km" type="number" value="'+(v.km||0)+'"></div>';
  document.getElementById("modal").classList.add("open");
}

function saveModal(){
  if(mtype==="vehiculo"){
    var km=parseInt(gv("f-km"))||0;
    flota.push({id:Date.now(),pat:gv("f-pat").toUpperCase(),pk:gv("f-pat").replace(/[^A-Z0-9]/gi,"").toUpperCase(),veh:gv("f-veh"),anio:parseInt(gv("f-anio"))||0,und:gv("f-und"),chasis:gv("f-chasis"),motor:gv("f-motor"),aseg:gv("f-aseg"),tseg:gv("f-tseg"),seguro:gv("f-seg"),vtv:gv("f-vtv"),imp:gv("f-imp"),km:km,lsrv:0,estado:"disponible",taller:"",obs:""});
  } else if(mtype==="servicio"){
    var km=parseInt(gv("f-km"))||0, vid=parseInt(gv("f-vid"));
    srvs.push({id:Date.now(),fid:vid,fecha:gv("f-fecha"),km:km,tipo:gv("f-tipo"),notas:gv("f-notas")});
    var v=flota.find(function(f){return f.id===vid;});
    if(v){v.lsrv=km;v.km=Math.max(v.km,km);}
  } else if(mtype==="reparacion"){
    reps.push({id:Date.now(),fid:parseInt(gv("f-vid")),fecha:gv("f-fecha"),desc:gv("f-desc"),taller:gv("f-taller"),costo:parseFloat(gv("f-costo"))||0});
  } else if(mtype&&mtype.indexOf("salida_")===0){
    var vid2=parseInt(mtype.slice(7));
    var v=flota.find(function(f){return f.id===vid2;});
    if(v){
      var costo=parseFloat(gv("f-costo"))||0;
      var desc=gv("f-desc");
      var taller=gv("f-taller");
      var km2=parseInt(gv("f-km"))||v.km;
      v.estado="disponible"; v.km=km2;
      if(desc||costo) reps.push({id:Date.now(),fid:vid2,fecha:gv("f-fecha"),desc:desc||"Salida de taller",taller:taller,costo:costo});
      v.obs="";
    }
  } else if(mtype&&mtype.indexOf("ingreso_")===0){
    var vid3=parseInt(mtype.slice(8));
    var v=flota.find(function(f){return f.id===vid3;});
    if(v){
      v.estado="taller";
      v.taller=gv("f-taller");
      v.obs=gv("f-desc");
      v.km=parseInt(gv("f-km"))||v.km;
    }
  } else if(mtype&&mtype.indexOf("km_")===0){
    var v=flota.find(function(f){return f.id===parseInt(mtype.slice(3));});
    if(v) v.km=parseInt(gv("f-km"))||v.km;
  } else if(mtype&&mtype.indexOf("edit_")===0){
    var v=flota.find(function(f){return f.id===parseInt(mtype.slice(5));});
    if(v){v.aseg=gv("f-aseg");v.tseg=gv("f-tseg");v.seguro=gv("f-seg");v.vtv=gv("f-vtv");v.imp=gv("f-imp");v.estado=gv("f-est");v.taller=gv("f-taller");v.km=parseInt(gv("f-km"))||v.km;v.obs=gv("f-obs");}
  }
  document.getElementById("modal").classList.remove("open");
  renderSel(); renderDetail();
}

function closeBg(e){ if(e.target.id==="modal") document.getElementById("modal").classList.remove("open"); }

renderSel();
renderDetail();
</script>
